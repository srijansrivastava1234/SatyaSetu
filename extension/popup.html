<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SatyaSetu Quick Verifier</title>
  <style>
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-weight: 600;
    }
    .badge-false { background: #991b1b; color: #fecaca; }
    .badge-true { background: #065f46; color: #a7f3d0; }
    .badge-pending { background: #374151; color: #d1d5db; }
    .claim-box {
      background: #1e293b;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 12px;
      border-left: 3px solid #38bdf8;
    }
    .explanation {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .copy-btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 9px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .copy-btn:hover { background: #1d4ed8; }
    .toast {
      display: none;
      text-align: center;
      font-size: 11px;
      color: #34d399;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">SatyaSetu (सत्यसेतु)</div>
    <div id="verdictBadge" class="badge badge-pending">IDLE</div>
  </div>

  <div id="queryText" class="claim-box">
    Highlight text on any webpage or WhatsApp Web and right-click "Verify with SatyaSetu".
  </div>

  <div id="explanationText" class="explanation">
    Awaiting input verification.
  </div>

  <button id="copyDebunkBtn" class="copy-btn">
    📋 Copy WhatsApp Rebuttal
  </button>
  <div id="toast" class="toast">✓ Copied to clipboard! Ready to forward.</div>

  <div style="text-align: center; margin-top: 10px; font-size: 10px; color: #64748b;">
    Connected: <span id="engineStatus" style="color:#38bdf8;">Cloud (Render) / Local</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
