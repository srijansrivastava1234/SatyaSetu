<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404: Evidence Record Not Found | SatyaSetu Intelligence Engine</title>
  <meta name="description" content="The requested claim record does not exist in the verification database." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      margin: 0;
    }
    .error-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 48px 36px;
      max-width: 520px;
      text-align: center;
      box-shadow: var(--shadow-panel);
    }
    .error-code {
      font-family: var(--font-mono);
      font-size: 4.5rem;
      font-weight: 800;
      color: var(--color-danger);
      line-height: 1;
      margin: 16px 0;
      letter-spacing: -0.05em;
    }
    .error-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    .error-desc {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>
  <main class="error-card">
    <span class="badge badge-error">HTTP 404 • Resource Purged or Missing</span>
    <div class="error-code">404</div>
    <h1 class="error-title">Verification Record Not Found</h1>
    <p class="error-desc">
      The specific claim dossier or endpoint requested is not indexed in the SatyaSetu persistence layer. The route may have been decommissioned or the URI might be mistyped.
    </p>
    <div>
      <a href="/" class="btn btn-primary" style="text-decoration:none; display:inline-flex;">
        Return to Verification Terminal
      </a>
    </div>
  </main>
</body>
</html>
